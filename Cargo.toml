[package]
name = "dig-account"
version = "0.25.0"
edition = "2021"
rust-version = "1.81"
description = "The DIG Network user Account: the fat, strictly-logical crate for everything an account does — the Account+Profile object model, unlock policy + keystore crypto, the in-process identity+money signer, per-profile key/DEK derivation, DID+dig-store mint/sign, and all wallet ops. Headless (no UI). Consumed by dig-app."
license = "GPL-2.0-only"
repository = "https://github.com/DIG-Network/dig-account"
homepage = "https://github.com/DIG-Network/dig-account"
documentation = "https://docs.rs/dig-account"
readme = "README.md"
keywords = ["dig", "account", "wallet", "identity", "custody"]
categories = ["cryptography", "authentication"]
# `tests/compile_fail/*.stderr` is NOT optional packaging: the trybuild snapshots ARE the custody
# proofs (the #1698 exploit does not compile, an approval cannot be minted outside the crate). Omit them
# and the published crate's headline evidence silently stops running. Verify with `cargo package --list`.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "tests/compile_fail/*.stderr",
    "SPEC.md",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE*",
]

[features]
default = []
# The blocking HTTPS transport behind `CoinsetPublisher` (the mainnet broadcast seam). OFF by
# default: a consumer that already has a node — dig-app pushes over its own node's RPC — must not be
# made to carry an HTTP client. The mainnet mint harness turns it on.
coinset-push = ["dep:ureq"]

[dependencies]
# The canonical money signer + independent spend verification live in dig-wallet-backend's `client`
# seam (LocalSigner, verify::derive_summary). Only the `client` half is pulled in — dig-account is the
# key-holding custody side, never the running engine (no tokio runtime / rusqlite / offer builders).
dig-wallet-backend = { version = "0.31", default-features = false, features = ["client"] }
dig-session = "0.8"
# 0.7 is what `dig-social-profile` 0.6 already resolves, so asking for it here UNIFIES this crate's
# own identity types with the social-profile seam rather than adding a line. A second line (0.6)
# remains in the tree via dig-wallet-backend 0.29 and no dig-identity type crosses that boundary;
# it collapses when dig-wallet-backend adopts 0.7 (dig-account#36).
dig-identity = "0.7.1"
dig-keystore = "0.9"
# Held at ^0.10, which is what `dig-wallet-backend` 0.29 requires. 0.11 is published and this crate
# could ask for it, but doing so resolves a SECOND dig-constants line beside the one the money
# engine already carries rather than upgrading that edge — the same trap the dig-merkle note below
# records. It moves when dig-wallet-backend moves (dig-account#36).
dig-constants = "0.11"
dig-ipc-protocol = "0.3"
# The canonical Chia DID expert crate: it builds every DID coin spend and reports the exact
# signatures required (INV-2/INV-3 — key-free, unsigned output). dig-account NEVER hand-rolls a DID
# spend bundle; it supplies the funding coin, signs what dig-did reports, and broadcasts.
# 0.7 is the first release carrying `dig_did::melt`, without which a profile cannot be deleted at
# all: the DID half of the deletion has no builder before it. Its dependency set is the same chia
# 0.36.1 / chia-wallet-sdk 0.34 family this crate already resolves, so the bump costs no second
# subtree.
#
# It DOES resolve a second dig-did LINE, because dig-social-profile 0.6 pins ^0.6 and no later
# release exists. That is tolerable only because the dig-social-profile boundary is narrow by
# construction — slots go in, a plain `[u8; 32]` root comes out — so no dig-did type crosses it and
# the two lines can never meet. Re-check that with `cargo tree -i dig-did@0.6.0` after any bump; if
# a dig-did type ever DOES cross that boundary, the second line becomes a byte-drift hazard and
# dig-social-profile must be released onto ^0.7 first.
dig-did = "0.8"
# The ONE canonical chain-READ seam. The mint reads its funding coins and its on-chain mint evidence
# through this trait, so dig-account depends on no concrete provider and can never be handed a
# bespoke reader that lies about confirmation.
# Floor raised to the version this tree already resolves. The rest of the `dig-*` set is
# deliberately NOT bumped: dig-keystore 0.10, dig-constants 0.11 and dig-wallet-backend 0.30 each
# split a dependency into two lines here, because dig-session 0.7.0 — already the latest release —
# still pins `dig-constants ^0.10` and `dig-keystore ^0.9`. That cascade is owed in dig-session
# (release-first, CLAUDE.md §4.1), not workaroundable from this crate, and bridging the two lines
# with a shim is the byte-drift class §4.1 exists to prevent. Verify with
# `cargo tree -i dig-constants` after dig-session next releases.
dig-chainsource-interface = "0.3.1"
# The canonical dig-store LAUNCH driver. dig-account never hand-rolls a store launch: the launcher,
# the eve store and the owner-discovery memos all come from here, and the parent conditions it hands
# back are folded into the DID's own spend so the two ride in one atomic bundle.
#
# DO NOT bump to ^0.8 to "keep current" (re-measured 2026-08-24: 0.8.0 is the index latest).
# dig-store 0.7.1 — reached through dig-social-profile 0.6 — requires dig-merkle ^0.6, and ^0.6
# excludes every later minor. Asking for ^0.8 here does not upgrade that edge; it resolves a SECOND
# dig-merkle line beside it. The cascade runs dig-store first, then dig-social-profile, then here. 0.6 and 0.7 both already build on
# chia-wallet-sdk 0.34, so ^0.6 costs nothing and keeps the tree single-rooted.
dig-merkle = "0.9"
# The profile SMT **schema only** — `Profile::with_schema_v2`, `SlotId`, `Value`, `build_root`.
#
# 0.4 is the first release on the chia 0.36.1 / chia-wallet-sdk 0.34 family. Before it, this crate
# pinned dig-did ^0.4 and dig-store ^0.5, which dragged a SECOND chia subtree (chia-wallet-sdk 0.30)
# into the money path through two independent chains. Keep this at ^0.4 or newer: dropping back
# re-splits every chia type in this binary, which is the byte-drift class that has cost real money.
#
# The boundary is still narrow by design: a seeded profile goes in as slots and comes out as a plain
# `[u8; 32]` root (`ProfileSeed`), so no chia type crosses it. Nothing else from this crate may be
# used — in particular NOT `IdentityProfile::mint_from_did`, which cannot mint a DID-rooted store
# (see `mint::store_launch`).
dig-social-profile = "0.7"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chia-bls = "0.36.1"
# The `serde` feature is required: coin ids and launcher ids are persisted in the profile
# registry as canonical 0x-hex strings (SPEC §2.4).
chia-protocol = { version = "0.36.1", features = ["serde"] }
chia-puzzle-types = "0.36.1"
chia-wallet-sdk = { version = "0.36", features = ["chip-0035"] }
clvmr = "0.16"
# Asset ids and puzzle hashes are rendered as lowercase hex in a summary line.
hex = "0.4"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# The profile registry persists itself as JSON (`ProfileRegistry::to_json`/`from_json`), so this is
# a runtime dependency, not a test-only one.
serde_json = "1"
zeroize = "1"
# The RFC 4226 HOTP core (HMAC + dynamic truncation) that RFC 6238 TOTP is defined over. A vetted
# RustCrypto-backed implementation is used deliberately: hand-rolling HMAC or the truncation is
# exactly the class of bespoke crypto this crate must never contain. dig-account supplies the
# counter window, the constant-time comparison and the replay guard around it; the primitive itself
# is not ours.
totp-lite = "2"
# Constant-time equality for the presented TOTP code. A byte-wise `==` on a code leaks, through
# timing, how long a prefix an attacker guessed correctly, which turns an 8-digit search into eight
# 10-way searches.
subtle = "2.6"
# RFC 4648 base32 for the TOTP secret (the encoding every authenticator app enrolls from) and
# base64url for the WebAuthn credential/challenge encodings. Already resolved in this tree.
data-encoding = "2.11"
# ES256 (`-7`) assertion verification for passkeys — the algorithm every platform authenticator
# (Windows Hello, Touch ID, Android) produces. Held at ^0.13 rather than ^0.14 ON PURPOSE: 0.13.2 is
# already resolved transitively here, and 0.14 moves to a new `elliptic-curve` line, so asking for
# "latest" would resolve a SECOND curve subtree in a custody crate for no capability gain.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# The clientDataJSON and RP-id hashes WebAuthn defines. ^0.10 matches the line the rest of this tree
# (and chia-*) already resolves; p256 0.13 uses the same one, so no second digest subtree appears.
sha2 = "0.10"
# OS randomness for TOTP secrets and WebAuthn challenges. ^0.6 is the line p256 0.13 and
# dig-keystore already resolve, so `OsRng` here is the same type they use.
rand_core = { version = "0.6", features = ["getrandom"] }
# OPTIONAL, `coinset-push` only: the blocking HTTPS client behind `BlockingHttpTransport`. The
# response MAPPING is deliberately independent of it, so the mempool-verdict logic is unit-tested
# through the `PushTransport` seam with no client and no network at all.
ureq = { version = "2", optional = true }

[dev-dependencies]
# Test-only: the INDEPENDENT BIP-39 expansion used as the reference for the account root, so a
# drift between dig-session's expansion and the standard one is caught rather than cancelling out.
bip39 = "2.0"
anyhow = "1"
hex = "0.4"
# `rt-multi-thread` is not decoration: chia-query's synchronous ChainSource facade fails CLOSED on a
# current-thread runtime, and reports that as a transport error which reads exactly like a network
# problem (chia-query SPEC §7).
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# Test-only: the ONLY published ChainSource impl that serves `resolve_singleton_lineage`, which the
# store half needs via `dig_did::walk_did_lineage_to_tip`. Used by the ignored mainnet harness.
#
# Held at ^0.8, the first line on chia-wallet-sdk 0.34. 0.7 pinned ^0.33, and because 0.33 and 0.34
# are incompatible 0.x minors, it resolved a THIRD chia-wallet-sdk alongside the crate's own — under
# `cfg(test)`, which is precisely where the mainnet mint harness proves its spends.
chia-query = "0.16"
serde_json = "1"
# The in-process Chia Simulator: the mint's spend bundle is proven against a real consensus
# validator (CLVM + signature verification) before any mainnet broadcast is contemplated.
chia-sdk-test = "0.36"
# The schema crate, in TESTS only: the edit seam's acceptance is that the root it commits equals the
# one dig-social-profile computes from the same slots, and only a direct call can state that
# independently of the wrapper under test.
dig-social-profile = "0.7"
# Test-only: the consensus ErrorCode enum, so the orphaned-secondary test can pin its refusal to
# AssertCoinAnnouncementFailed specifically. A bare is_err() there would be satisfied by a signature
# failure and would leave the input binding untested. Pinned to the version chia-sdk-test 0.34
# resolves to; a divergence makes the two ErrorCode types differ and fails LOUDLY at compile time.
chia-consensus = "0.36.1"
# Test-only: a DERIVED k1 keypair for the secp-refusal fixture (the gate must refuse a signature
# requirement a DID mint never produces). Pinned to the version chia-wallet-sdk 0.34 resolves to.
chia-secp = "0.36.1"
sha2 = "0.10"
# Compile-fail proofs: several custody properties of `SpendApproval` are TYPE-SYSTEM properties, so
# the only honest test for them is that the wrong code does not compile.
# Test-only: the RFC 4226 primitive called DIRECTLY, as an independent oracle for the expected code
# at a counter. Deriving that expectation from the verifier under test would agree with any
# verifier; `tests/totp_rfc6238_vectors.rs` is what pins the primitive itself to the RFC.
totp-lite = "2"
# Test-only: `SigningKey`, so every passkey fixture signs with a REAL P-256 key. A symmetric mock
# cannot distinguish a verifier that checks a signature from one that checks nothing.
p256 = { version = "0.13", features = ["ecdsa"] }
# Test-only: base32/base64url decoding in fixtures, so a fixture never has to re-implement one.
data-encoding = "2.11"
trybuild = "1.0"
static_assertions = "1.1"

[lints.rust]
unsafe_code = "forbid"

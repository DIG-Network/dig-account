name: Publish to crates.io

# Tag-driven release: pushing a version tag `vX.Y.Z` runs the gates, publishes to crates.io, and
# cuts a GitHub Release. A normal push to `main` runs the gates only (see ci.yml) — it does NOT
# publish. Mirrors the sibling DIG crates so the same org secrets apply.
#
# Release-first ordering (§4.1): every dig-account dependency is already a crates.io-published
# version — dig-social-profile, dig-session, dig-identity, dig-keystore, dig-constants,
# dig-ipc-protocol, chia-* — no git/path deps, so this crate publishes cleanly bottom-up.
#
# workflow_dispatch is provided so the FIRST release can be kicked manually (the new-crate
# first-release race: the squash-merge that first adds this file does not auto-fire release.yml).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # No fmt/clippy/test/coverage re-run here: the PR that produced this tagged commit already went
  # through ci.yml's full gate set before it was allowed to merge. This workflow is build + package +
  # publish only.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify the package builds
        run: cargo build --release

      - name: Verify the package can be packaged
        run: cargo package --locked

      - name: Check CARGO_REGISTRY_TOKEN is set
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set in repository settings"
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "dig-account v${{ steps.extract_version.outputs.VERSION }}"
          body: |
            ## dig-account v${{ steps.extract_version.outputs.VERSION }}

            The DIG Network user Account: the headless (zero-UI) crate for the Account+Profile object
            model, unlock policy + keystore crypto, the in-process identity signer, per-profile
            key/DEK derivation, and the money-signer + two-tier custody policy seams. Consumed by
            dig-app.

            ### Installation
            ```toml
            [dependencies]
            dig-account = "${{ steps.extract_version.outputs.VERSION }}"
            ```
          draft: false
          prerelease: false
